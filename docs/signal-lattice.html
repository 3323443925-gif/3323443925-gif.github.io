<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Lattice — Generative Art Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --anthropic-dark: #141413;
      --anthropic-light: #faf9f5;
      --anthropic-mid-gray: #b0aea5;
      --anthropic-light-gray: #e8e6dc;
      --anthropic-orange: #d97757;
      --anthropic-blue: #6a9bcc;
      --anthropic-green: #788c5d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
      min-height: 100vh;
      color: var(--anthropic-dark);
    }

    .container {
      display: flex;
      min-height: 100vh;
      padding: 20px;
      gap: 20px;
    }

    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar h1 {
      font-family: 'Lora', serif;
      font-size: 24px;
      font-weight: 500;
      color: var(--anthropic-dark);
      margin-bottom: 8px;
    }

    .sidebar .subtitle {
      color: var(--anthropic-mid-gray);
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.4;
    }

    .control-section { margin-bottom: 32px; }

    .control-section h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--anthropic-dark);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-section h3::before {
      content: '•';
      color: var(--anthropic-orange);
      font-weight: bold;
    }

    .seed-input {
      width: 100%;
      background: var(--anthropic-light);
      padding: 12px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--anthropic-light-gray);
      text-align: center;
    }

    .seed-input:focus {
      outline: none;
      border-color: var(--anthropic-orange);
      box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
      background: white;
    }

    .seed-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .control-group { margin-bottom: 20px; }

    .control-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--anthropic-dark);
      margin-bottom: 8px;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-container input[type="range"] {
      flex: 1;
      height: 4px;
      background: var(--anthropic-light-gray);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }

    .slider-container input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--anthropic-orange);
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .slider-container input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
      background: #c86641;
    }

    .slider-container input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: var(--anthropic-orange);
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .value-display {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: var(--anthropic-mid-gray);
      min-width: 60px;
      text-align: right;
    }

    .color-group { margin-bottom: 16px; }

    .color-group label {
      display: block;
      font-size: 12px;
      color: var(--anthropic-mid-gray);
      margin-bottom: 4px;
    }

    .color-picker-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-picker-container input[type="color"] {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .color-value {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: var(--anthropic-mid-gray);
    }

    .button {
      background: var(--anthropic-orange);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .button:hover {
      background: #c86641;
      transform: translateY(-1px);
    }

    .button:active { transform: translateY(0); }

    .button.secondary { background: var(--anthropic-blue); }
    .button.secondary:hover { background: #5a8bb8; }
    .button.tertiary { background: var(--anthropic-green); }
    .button.tertiary:hover { background: #6b7b52; }

    .button-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .button-row .button { flex: 1; }

    .canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    #canvas-container {
      width: 100%;
      max-width: 1000px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
      background: white;
    }

    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--anthropic-mid-gray);
      min-height: 600px;
    }

    @media (max-width: 600px) {
      .container { flex-direction: column; }
      .sidebar { width: 100%; }
      .canvas-area { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h1>Signal Lattice</h1>
      <div class="subtitle">
        A seeded study of service graphs, queued signals, and the quiet order between them.
        Built for a Java backend learning in public.
      </div>

      <div class="control-section">
        <h3>Seed</h3>
        <input type="number" id="seed-input" class="seed-input" value="20261117" onchange="updateSeed()">
        <div class="seed-controls">
          <button class="button secondary" onclick="previousSeed()">← Prev</button>
          <button class="button secondary" onclick="nextSeed()">Next →</button>
        </div>
        <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
      </div>

      <div class="control-section">
        <h3>Parameters</h3>

        <div class="control-group">
          <label>Node Count</label>
          <div class="slider-container">
            <input type="range" id="nodeCount" min="60" max="240" step="10" value="150" oninput="updateParam('nodeCount', this.value)">
            <span class="value-display" id="nodeCount-value">150</span>
          </div>
        </div>

        <div class="control-group">
          <label>Link Radius</label>
          <div class="slider-container">
            <input type="range" id="linkRadius" min="90" max="240" step="10" value="165" oninput="updateParam('linkRadius', this.value)">
            <span class="value-display" id="linkRadius-value">165</span>
          </div>
        </div>

        <div class="control-group">
          <label>Pulse Speed</label>
          <div class="slider-container">
            <input type="range" id="pulseSpeed" min="0.2" max="2" step="0.1" value="0.9" oninput="updateParam('pulseSpeed', this.value)">
            <span class="value-display" id="pulseSpeed-value">0.9</span>
          </div>
        </div>

        <div class="control-group">
          <label>Field Warp</label>
          <div class="slider-container">
            <input type="range" id="warp" min="0" max="1" step="0.05" value="0.35" oninput="updateParam('warp', this.value)">
            <span class="value-display" id="warp-value">0.35</span>
          </div>
        </div>

        <div class="control-group">
          <label>Line Weight</label>
          <div class="slider-container">
            <input type="range" id="lineWeight" min="0.4" max="2" step="0.1" value="0.9" oninput="updateParam('lineWeight', this.value)">
            <span class="value-display" id="lineWeight-value">0.9</span>
          </div>
        </div>
      </div>

      <div class="control-section">
        <h3>Colors</h3>

        <div class="color-group">
          <label>Ink</label>
          <div class="color-picker-container">
            <input type="color" id="color1" value="#121419" onchange="updateColor('ink', this.value, 'color1-value')">
            <span class="color-value" id="color1-value">#121419</span>
          </div>
        </div>

        <div class="color-group">
          <label>Cobalt</label>
          <div class="color-picker-container">
            <input type="color" id="color2" value="#1b3fdf" onchange="updateColor('cobalt', this.value, 'color2-value')">
            <span class="color-value" id="color2-value">#1b3fdf</span>
          </div>
        </div>

        <div class="color-group">
          <label>Signal</label>
          <div class="color-picker-container">
            <input type="color" id="color3" value="#d94a22" onchange="updateColor('signal', this.value, 'color3-value')">
            <span class="color-value" id="color3-value">#d94a22</span>
          </div>
        </div>
      </div>

      <div class="control-section">
        <h3>Actions</h3>
        <div class="button-row">
          <button class="button" onclick="regenerate()">Regenerate</button>
          <button class="button secondary" onclick="resetParameters()">Reset</button>
        </div>
        <button class="button tertiary" onclick="downloadArt()">Download PNG</button>
      </div>
    </div>

    <div class="canvas-area">
      <div id="canvas-container">
        <div class="loading">Initializing Signal Lattice...</div>
      </div>
    </div>
  </div>

  <script>
    let params = {
      seed: 20261117,
      nodeCount: 150,
      linkRadius: 165,
      pulseSpeed: 0.9,
      warp: 0.35,
      lineWeight: 0.9,
      palette: {
        ink: '#121419',
        cobalt: '#1b3fdf',
        signal: '#d94a22'
      }
    };

    const defaults = JSON.parse(JSON.stringify(params));
    const paper = '#faf9f5';

    let nodes = [];
    let edges = [];
    let pulses = [];
    let hubs = [];

    function setup() {
      const canvas = createCanvas(1200, 1200);
      canvas.parent('canvas-container');
      pixelDensity(1);
      frameRate(30);
      initSystem();
      document.querySelector('.loading').style.display = 'none';
    }

    function initSystem() {
      randomSeed(params.seed);
      noiseSeed(params.seed);

      nodes = [];
      edges = [];
      pulses = [];
      hubs = [];

      const cols = Math.ceil(Math.sqrt(params.nodeCount * 1.45));
      const rows = Math.ceil(params.nodeCount / cols);
      const margin = 110;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (nodes.length >= params.nodeCount) break;
          if (random() < 0.12) continue;
          const x = map(c, 0, cols - 1, margin, width - margin) + random(-26, 26);
          const y = map(r, 0, rows - 1, margin, height - margin) + random(-26, 26);
          nodes.push({
            baseX: x,
            baseY: y,
            x,
            y,
            phase: random(TWO_PI),
            baseSize: random(1.6, 3.4),
            degree: 0,
            size: 2
          });
        }
      }

      const candidates = [];
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const d = dist(nodes[i].baseX, nodes[i].baseY, nodes[j].baseX, nodes[j].baseY);
          if (d < params.linkRadius) candidates.push({ i, j, d });
        }
      }
      candidates.sort((a, b) => a.d - b.d);

      for (const candidate of candidates) {
        if (nodes[candidate.i].degree >= 4 || nodes[candidate.j].degree >= 4) continue;
        nodes[candidate.i].degree++;
        nodes[candidate.j].degree++;
        edges.push({
          a: candidate.i,
          b: candidate.j,
          curve: random(-26, 26),
          weight: map(candidate.d, 0, params.linkRadius, 1, 0.25)
        });
      }

      for (const node of nodes) {
        node.size = map(node.degree, 0, 7, node.baseSize, node.baseSize + 2.6, true);
      }

      hubs = nodes
        .map((node, index) => ({ index, degree: node.degree }))
        .sort((a, b) => b.degree - a.degree)
        .slice(0, 4)
        .map((hub) => hub.index);

      for (const edge of edges) {
        if (random() < 0.22) {
          pulses.push({
            edge,
            t: random(),
            baseSpeed: random(0.002, 0.0045),
            signal: hubs.includes(edge.a) || hubs.includes(edge.b)
          });
        }
      }

      background(paper);
    }

    function draw() {
      background(paper);
      const time = frameCount;

      for (const node of nodes) {
        const nx = noise(node.baseX * 0.0016, node.baseY * 0.0016, time * 0.0014) - 0.5;
        const ny = noise(node.baseY * 0.0016 + 31.7, node.baseX * 0.0016 + 17.3, time * 0.0014) - 0.5;
        node.x = node.baseX + nx * 46 * params.warp;
        node.y = node.baseY + ny * 46 * params.warp;
      }

      strokeCap(ROUND);
      for (const edge of edges) {
        const a = nodes[edge.a];
        const b = nodes[edge.b];
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len = Math.hypot(dx, dy) || 1;
        edge.cx = mx + (-dy / len) * edge.curve;
        edge.cy = my + (dx / len) * edge.curve;

        stroke(params.palette.ink);
        strokeWeight(params.lineWeight * edge.weight);
        drawingContext.globalAlpha = 0.12 + edge.weight * 0.11;
        noFill();
        beginShape();
        vertex(a.x, a.y);
        quadraticVertex(edge.cx, edge.cy, b.x, b.y);
        endShape();
      }
      drawingContext.globalAlpha = 1;

      noStroke();
      for (const pulse of pulses) {
        pulse.t += pulse.baseSpeed * params.pulseSpeed;
        if (pulse.t > 1) pulse.t -= 1;

        const edge = pulse.edge;
        const a = nodes[edge.a];
        const b = nodes[edge.b];
        const control = { x: edge.cx, y: edge.cy };
        const color = pulse.signal ? params.palette.signal : params.palette.cobalt;

        for (let k = 0; k < 4; k++) {
          const t = pulse.t - k * 0.016;
          if (t < 0) continue;
          const point = quadPoint(a, control, b, t);
          fill(color);
          drawingContext.globalAlpha = 0.9 * (1 - k / 5);
          circle(point.x, point.y, 4.6 * (1 - k / 5));
        }

        const head = quadPoint(a, control, b, pulse.t);
        drawingContext.globalAlpha = 0.12;
        circle(head.x, head.y, 14);
      }
      drawingContext.globalAlpha = 1;

      for (let i = 0; i < nodes.length; i++) {
        const node = nodes[i];
        const isHub = hubs.includes(i);
        noStroke();
        fill(params.palette.ink);
        drawingContext.globalAlpha = isHub ? 0.92 : 0.6;
        circle(node.x, node.y, node.size);

        if (isHub) {
          noFill();
          stroke(params.palette.signal);
          strokeWeight(1.1);
          drawingContext.globalAlpha = 0.6;
          circle(node.x, node.y, node.size + 16 + Math.sin(time * 0.03 + node.phase) * 2);
          drawingContext.globalAlpha = 0.22;
          circle(node.x, node.y, node.size + 30);
        }
      }
      drawingContext.globalAlpha = 1;

      noFill();
      stroke(params.palette.ink);
      strokeWeight(1);
      drawingContext.globalAlpha = 0.1;
      rect(40, 40, width - 80, height - 80);

      noStroke();
      fill(params.palette.ink);
      textFont('Courier New');
      textSize(12);
      drawingContext.globalAlpha = 0.55;
      text('SIGNAL LATTICE / SEED ' + params.seed, 58, height - 58);
      drawingContext.globalAlpha = 1;
    }

    function quadPoint(a, c, b, t) {
      const u = 1 - t;
      return {
        x: u * u * a.x + 2 * u * t * c.x + t * t * b.x,
        y: u * u * a.y + 2 * u * t * c.y + t * t * b.y
      };
    }

    function updateParam(name, value) {
      params[name] = parseFloat(value);
      const display = document.getElementById(name + '-value');
      if (display) display.textContent = value;

      if (name === 'nodeCount' || name === 'linkRadius') {
        initSystem();
      }
    }

    function updateColor(key, value, displayId) {
      params.palette[key] = value;
      document.getElementById(displayId).textContent = value;
    }

    function updateSeedDisplay() {
      document.getElementById('seed-input').value = params.seed;
    }

    function updateSeed() {
      const input = document.getElementById('seed-input');
      const newSeed = parseInt(input.value, 10);
      if (newSeed && newSeed > 0) {
        params.seed = newSeed;
        initSystem();
      } else {
        updateSeedDisplay();
      }
    }

    function previousSeed() {
      params.seed = Math.max(1, params.seed - 1);
      updateSeedDisplay();
      initSystem();
    }

    function nextSeed() {
      params.seed = params.seed + 1;
      updateSeedDisplay();
      initSystem();
    }

    function randomSeedAndUpdate() {
      params.seed = Math.floor(Math.random() * 999999) + 1;
      updateSeedDisplay();
      initSystem();
    }

    function regenerate() {
      randomSeedAndUpdate();
    }

    function resetParameters() {
      params = JSON.parse(JSON.stringify(defaults));

      const controls = ['nodeCount', 'linkRadius', 'pulseSpeed', 'warp', 'lineWeight'];
      for (const name of controls) {
        document.getElementById(name).value = params[name];
        document.getElementById(name + '-value').textContent = params[name];
      }

      document.getElementById('color1').value = params.palette.ink;
      document.getElementById('color1-value').textContent = params.palette.ink;
      document.getElementById('color2').value = params.palette.cobalt;
      document.getElementById('color2-value').textContent = params.palette.cobalt;
      document.getElementById('color3').value = params.palette.signal;
      document.getElementById('color3-value').textContent = params.palette.signal;

      updateSeedDisplay();
      initSystem();
    }

    function downloadArt() {
      saveCanvas('signal-lattice-' + params.seed, 'png');
    }

    window.addEventListener('load', function () {
      updateSeedDisplay();
    });
  </script>
</body>
</html>
