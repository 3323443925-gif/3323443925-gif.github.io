<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
  <title>静态站点性能预算的文章封面</title>
  <defs>
    <pattern id="grid-perf" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#2c313c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#171a1f"/>
  <rect width="1600" height="1000" fill="url(#grid-perf)" opacity="0.7"/>
  <text x="120" y="130" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="6" fill="#8c94a3">PERFORMANCE BUDGET</text>
  <text x="1400" y="130" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="6" fill="#8c94a3">05</text>
  <line x1="120" y1="160" x2="1480" y2="160" stroke="#3a404d"/>
  <g transform="translate(120 240)">
    <rect x="0" y="0" width="700" height="560" rx="18" fill="#1f232c" stroke="#333947"/>
    <text x="40" y="56" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="3" fill="#8c94a3">BUDGET / KB</text>
    <text x="40" y="150" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#8c94a3">HTML + CSS</text>
    <rect x="40" y="170" width="560" height="18" rx="9" fill="#2c313c"/>
    <rect x="40" y="170" width="330" height="18" rx="9" fill="#6f8cf5"/>
    <text x="600" y="185" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#f7f5f0">64 / 80</text>
    <text x="40" y="250" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#8c94a3">JAVASCRIPT</text>
    <rect x="40" y="270" width="560" height="18" rx="9" fill="#2c313c"/>
    <rect x="40" y="270" width="70" height="18" rx="9" fill="#b4552d"/>
    <text x="600" y="285" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#f7f5f0">6 / 10</text>
    <text x="40" y="350" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#8c94a3">IMAGES</text>
    <rect x="40" y="370" width="560" height="18" rx="9" fill="#2c313c"/>
    <rect x="40" y="370" width="380" height="18" rx="9" fill="#f7f5f0" opacity="0.8"/>
    <text x="600" y="385" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#f7f5f0">210 / 300</text>
    <text x="40" y="450" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#8c94a3">FONTS</text>
    <rect x="40" y="470" width="560" height="18" rx="9" fill="#2c313c"/>
    <text x="600" y="485" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#f7f5f0">0</text>
    <text x="40" y="540" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#5c6474">MEASURED ON 4G / MOBILE</text>
  </g>
  <g transform="translate(900 300)">
    <circle cx="180" cy="180" r="150" fill="none" stroke="#3a404d" stroke-width="18"/>
    <path d="M180 30a150 150 0 0 1 130 225" fill="none" stroke="#6f8cf5" stroke-width="18" stroke-linecap="round"/>
    <text x="180" y="185" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="66" font-weight="700" fill="#f7f5f0">1.4s</text>
    <text x="180" y="225" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2" fill="#8c94a3">FIRST READ</text>
  </g>
  <text x="930" y="760" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="4" fill="#8c94a3">BUDGET IS A DECISION</text>
</svg>
