<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
  <title>AI 全栈学习路线文章封面</title>
  <defs>
    <pattern id="grid-roadmap" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#d8d1c2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#f2eee4"/>
  <rect width="1600" height="1000" fill="url(#grid-roadmap)" opacity="0.6"/>
  <text x="120" y="104" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="5" fill="#3b3f47">AI FULL-STACK / ROADMAP</text>
  <text x="1480" y="104" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="4" fill="#5f636c">05 LAYERS</text>
  <line x1="120" y1="136" x2="1480" y2="136" stroke="#b7ae9c"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3">
    <rect x="300" y="220" width="820" height="92" rx="8" fill="#121419"/>
    <text x="336" y="276" fill="#f2eee4">05 / FRONTEND DELIVERY</text>

    <rect x="260" y="342" width="860" height="92" rx="8" fill="#d94a22"/>
    <text x="296" y="398" fill="#fbf8f1">04 / AI APPLICATION</text>

    <rect x="220" y="464" width="900" height="92" rx="8" fill="#e7e1d3"/>
    <text x="256" y="520" fill="#121419">03 / MYSQL</text>

    <rect x="180" y="586" width="940" height="92" rx="8" fill="#e4e8fb"/>
    <text x="216" y="642" fill="#121419">02 / SPRING BOOT</text>

    <rect x="140" y="708" width="980" height="92" rx="8" fill="#1b3fdf"/>
    <text x="176" y="764" fill="#f2eee4">01 / JAVA BACKEND</text>
  </g>

  <line x1="1180" y1="800" x2="1180" y2="250" stroke="#121419" stroke-width="3"/>
  <path d="M1160 280l20-30 20 30" fill="none" stroke="#121419" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1210" y="540" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="3" fill="#5f636c" transform="rotate(90 1210 540)">LEARNING PATH</text>

  <text x="1480" y="930" text-anchor="end" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="250" font-weight="800" fill="none" stroke="#b7ae9c" stroke-width="2">05</text>
  <text x="120" y="920" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="3" fill="#5f636c">START FROM THE BACKEND, THEN GO FULL STACK.</text>
</svg>
